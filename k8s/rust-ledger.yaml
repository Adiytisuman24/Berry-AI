apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-ledger
  namespace: berry-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rust-ledger
  template:
    metadata:
      labels:
        app: rust-ledger
    spec:
      containers:
        - name: rust-ledger
          image: berry-ai/rust-ledger:latest
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: rust-ledger-service
  namespace: berry-ai
spec:
  selector:
    app: rust-ledger
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
