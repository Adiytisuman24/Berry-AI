apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: berry-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: berry-ai/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.berry.ai"
            - name: NEXT_PUBLIC_RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: razorpay-secrets
                  key: key_id
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: berry-ai
spec:
  selector:
    app: web
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
