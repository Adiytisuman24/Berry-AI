apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: berry-ingress
  namespace: berry-ai
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: app.berry.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000
    - host: api.berry.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-gateway-service
                port:
                  number: 8080
